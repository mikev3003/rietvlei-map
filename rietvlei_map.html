<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Friends of Rietvlei — Citizen Science Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --green-deep:  #1a3a2a;
    --green-mid:   #2d6a4f;
    --green-light: #52b788;
    --sand:        #e9c46a;
    --cream:       #f8f4ec;
    --mist:        rgba(255,255,255,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--green-deep);
    color: var(--cream);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1.4rem;
    background: linear-gradient(135deg, #0f2218 0%, var(--green-deep) 100%);
    border-bottom: 1px solid rgba(82,183,136,0.3);
    flex-shrink: 0;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: center; gap: 0.9rem; }
  .logo { width: 42px; height: 42px; background: var(--green-mid); border-radius: 50%;
          display: grid; place-items: center; font-size: 1.4rem;
          border: 2px solid var(--green-light); flex-shrink: 0; }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(0.9rem,2.5vw,1.25rem); line-height: 1.2; }
  h1 span { display: block; font-family: 'DM Sans', sans-serif; font-weight: 300;
            font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--green-light); margin-top: 2px; }
  .stats { display: flex; gap: 1rem; flex-wrap: wrap; }
  .stat { text-align: center; background: var(--mist); border: 1px solid rgba(82,183,136,0.2);
          border-radius: 8px; padding: 0.3rem 0.7rem; }
  .stat-n { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--green-light); line-height: 1; }
  .stat-l { font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
            color: rgba(248,244,236,0.45); margin-top: 2px; }

  /* ── Filter bar ── */
  #filters {
    display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap;
    padding: 0.45rem 1.4rem;
    background: rgba(10,28,18,0.9);
    border-bottom: 1px solid rgba(82,183,136,0.12);
    flex-shrink: 0;
  }
  #filters label { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
                   color: var(--green-light); white-space: nowrap; }
  #filters input[type="text"], #filters input[type="date"] {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(82,183,136,0.3);
    color: var(--cream); border-radius: 6px; padding: 0.28rem 0.6rem;
    font-family: 'DM Sans', sans-serif; font-size: 0.8rem; outline: none;
  }
  #filters input[type="text"] { min-width: 155px; }
  #filters input::placeholder { color: rgba(248,244,236,0.3); }
  .sep { width: 1px; height: 20px; background: rgba(82,183,136,0.18); margin: 0 0.1rem; }

  /* ── Map ── */
  #map { flex: 1; min-height: 0; }

  /* ── Leaflet popup ── */
  .leaflet-popup-content-wrapper {
    background: var(--green-deep) !important; border: 1px solid var(--green-light) !important;
    border-radius: 12px !important; color: var(--cream) !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.55) !important;
    padding: 0 !important; overflow: hidden !important; width: 265px !important;
  }
  .leaflet-popup-tip { background: var(--green-deep) !important; }
  .leaflet-popup-content { margin: 0 !important; width: 100% !important; }
  .leaflet-popup-close-button { color: var(--green-light) !important; top: 9px !important; right: 9px !important; font-size: 16px !important; z-index: 10; }

  .pp-photo { width: 100%; height: 145px; object-fit: cover; display: block; background: #0f2218; }
  .pp-placeholder { width: 100%; height: 80px; background: linear-gradient(135deg,#1a3a2a,#2d6a4f);
                    display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
  .pp-body { padding: 0.8rem 1rem 1rem; }
  .pp-title { font-family: 'Playfair Display', serif; font-size: 0.95rem; color: var(--green-light);
              margin-bottom: 0.4rem; line-height: 1.3; }
  .pp-meta { font-size: 0.71rem; color: rgba(248,244,236,0.58); line-height: 1.9; }
  .pp-meta b { color: rgba(248,244,236,0.88); font-weight: 500; }
  .pp-notes { margin-top: 0.5rem; font-size: 0.74rem; font-style: italic;
              color: rgba(248,244,236,0.52); line-height: 1.45;
              border-top: 1px solid rgba(82,183,136,0.14); padding-top: 0.5rem; }
  .pp-drive { display: inline-block; margin-top: 0.55rem; font-size: 0.68rem;
              color: var(--green-light); text-decoration: none; letter-spacing: 0.05em; }
  .pp-drive:hover { text-decoration: underline; }

  /* Custom pin */
  .pin { width: 30px; height: 30px; background: var(--green-mid);
         border: 2.5px solid var(--green-light); border-radius: 50% 50% 50% 0;
         transform: rotate(-45deg); box-shadow: 0 3px 10px rgba(0,0,0,0.4); cursor: pointer; }
  .pin-inner { position: absolute; top: 50%; left: 50%;
               transform: translate(-50%,-50%) rotate(45deg);
               font-size: 12px; line-height: 1; margin-top: -1px; }

  /* Legend */
  .legend { background: rgba(10,28,18,0.92); border: 1px solid rgba(82,183,136,0.22);
            border-radius: 10px; padding: 0.6rem 0.85rem; font-size: 0.71rem; }
  .legend-title { font-family:'Playfair Display',serif; font-size:0.8rem; color:var(--green-light); margin-bottom:0.4rem; }

  /* Status toast */
  #status { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
            background: var(--green-deep); border: 1px solid var(--green-mid); color: var(--cream);
            padding: 0.45rem 1.1rem; border-radius: 20px; font-size: 0.76rem;
            z-index: 9999; display: none; box-shadow: 0 4px 18px rgba(0,0,0,0.4); }

  @media(max-width:500px){
    header,#filters{padding-left:0.9rem;padding-right:0.9rem;}
    .stats{gap:0.5rem;}
  }
</style>
</head>

<div id="filters">
  <label>Search:</label>
  <input type="text" id="q" placeholder="Observer or comments…"/>
  <div class="sep"></div>
  <label>From:</label>
  <input type="date" id="d-from"/>
  <label>To:</label>
  <input type="date" id="d-to"/>
</div>

<div id="map"></div>
<div id="status"></div>

<script>
// ══════════════════════════════════════════════════
//  PASTE YOUR GOOGLE SHEET CSV URL HERE
//  (run getPublicCsvUrl() in Apps Script to get it)
// ══════════════════════════════════════════════════
const CSV_URL = "https://docs.google.com/spreadsheets/d/1KmZK71xjIl0kfLVP9itfO_x32a8D0tVS_1z2dQaIMqo/export?format=csv&gid=1457485627";

// Column positions written by the Apps Script (0-based)
const C = {
  id:       0,   // Submission ID
  date:     1,   // Date
  time:     2,   // Time
  observer: 3,   // Observer (User name)
  email:    4,   // Email
  comments: 5,   // Comments
  lat:      6,   // Latitude
  lon:      7,   // Longitude
  photo:    8,   // Photo Drive URL
  maplink:  9    // Map Link
};

// ── Map — centred on Rietvlei Nature Reserve ──
const map = L.map("map").setView([-25.878, 28.272], 14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

// Satellite toggle
const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Tiles © Esri", maxZoom: 19 }
);
L.control.layers({ "Street map": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { attribution:'© OpenStreetMap', maxZoom:19 }).addTo(map), "Satellite": satellite }).addTo(map);

// ── State ──
let allRows = [];
let markers = {};

// ── Load ──
function load() {
  if (CSV_URL === "PASTE_YOUR_GOOGLE_SHEET_CSV_URL_HERE") {
    showDemo(); return;
  }
  toast("Loading sightings…", true);
  Papa.parse(CSV_URL, {
    download: true, header: false, skipEmptyLines: true,
    complete(r) {
      allRows = r.data.slice(1);  // skip header row
      render();
      toast("", false);
    },
    error(e) {
      toast("⚠ Could not load data — check CSV URL & sharing settings", true);
      console.error(e);
    }
  });
}

// ── Render markers ──
function render() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const q      = document.getElementById("q").value.toLowerCase();
  const dFrom  = document.getElementById("d-from").value;
  const dTo    = document.getElementById("d-to").value;

  let total = 0, photos = 0;
  const obsSet = new Set();

  allRows.forEach((r, i) => {
    const lat = parseFloat(r[C.lat]);
    const lon = parseFloat(r[C.lon]);
    if (isNaN(lat) || isNaN(lon)) return;

    const observer = r[C.observer] || "";
    const comments = r[C.comments] || "";
    const date     = r[C.date]     || "";
    const time     = r[C.time]     || "";
    const photo    = r[C.photo]    || "";

    // Filters
    if (q && !observer.toLowerCase().includes(q) && !comments.toLowerCase().includes(q)) return;
    const dateShort = date.slice(0, 10);
    if (dFrom && dateShort < dFrom) return;
    if (dTo   && dateShort > dTo)   return;

    const icon = L.divIcon({
      className: "",
      html: `<div class="pin"><div class="pin-inner">📍</div></div>`,
      iconSize: [30, 30], iconAnchor: [15, 28], popupAnchor: [0, -30]
    });

    const m = L.marker([lat, lon], { icon }).addTo(map);
    m.bindPopup(popup(observer, date, time, comments, photo));
    markers[i] = m;

    total++;
    obsSet.add(observer);
    if (photo) photos++;
  });

  document.getElementById("s-total").textContent  = total;
  document.getElementById("s-obs").textContent    = obsSet.size;
  document.getElementById("s-photos").textContent = photos;
}

// ── Popup HTML ──
function popup(observer, date, time, comments, photoUrl) {
  const dateStr = date
    ? new Date(date).toLocaleDateString("en-ZA", { day:"numeric", month:"long", year:"numeric" })
    : "–";
  const timeStr = time ? time.slice(0,5) : "";

  const photoHtml = photoUrl
    ? `<img class="pp-photo" src="${photoUrl}" alt="Sighting photo" onerror="this.parentNode.innerHTML='<div class=pp-placeholder>📷</div>'">`
    : `<div class="pp-placeholder">📷</div>`;

  const driveLink = photoUrl
    ? `<a class="pp-drive" href="${esc(photoUrl)}" target="_blank">📷 View full photo →</a>`
    : "";

  const notesHtml = comments
    ? `<div class="pp-notes">${esc(comments)}</div>` : "";

  return `${photoHtml}
    <div class="pp-body">
      <div class="pp-title">Rietvlei Sighting</div>
      <div class="pp-meta">
        <b>Observer:</b> ${esc(observer || "Anonymous")}<br>
        <b>Date:</b> ${dateStr}${timeStr ? " at " + timeStr : ""}
      </div>
      ${notesHtml}
      ${driveLink}
    </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Demo mode ──
function showDemo() {
  const notice = L.control({ position: "topleft" });
  notice.onAdd = () => {
    const d = L.DomUtil.create("div");
    d.style.cssText = "background:rgba(10,28,18,0.95);border:1px solid #e9c46a;border-radius:10px;padding:0.7rem 1rem;max-width:250px;font-size:0.74rem;color:#f8f4ec;line-height:1.55;";
    d.innerHTML = `<b style="color:#e9c46a">⚠ Demo mode</b><br>
      Paste your Google Sheet CSV URL into this file's <code>CSV_URL</code> variable to show real sightings.
      <br><br>Showing 4 example pins from your actual submission locations.`;
    return d;
  };
  notice.addTo(map);

  // Use the actual lat/lons from the real submissions in the XLS export
  const demo = [
    { lat: -25.77328, lon: 28.21258, obs: "Mike vd Laan", date: "2026-05-17", comments: "Ploughed land", photo: "" },
    { lat: -25.77328, lon: 28.21258, obs: "Mike vd Laan", date: "2026-05-17", comments: "High sediment levels observed in river", photo: "" },
    { lat: -25.88971, lon: 28.27374, obs: "Mikev",        date: "2026-08-29", comments: "Rietvlei Dam", photo: "" },
    { lat: -25.88611, lon: 28.27180, obs: "Mikev",        date: "2026-08-29", comments: "Where's this water coming from?", photo: "" },
  ];

  demo.forEach(d => {
    const icon = L.divIcon({
      className: "",
      html: `<div class="pin" style="background:#e9c46a;border-color:#b5835a"><div class="pin-inner">📍</div></div>`,
      iconSize:[30,30], iconAnchor:[15,28], popupAnchor:[0,-30]
    });
    L.marker([d.lat, d.lon], { icon }).addTo(map)
     .bindPopup(popup(d.obs, d.date, "", d.comments, ""));
  });

  document.getElementById("s-total").textContent  = demo.length;
  document.getElementById("s-obs").textContent    = new Set(demo.map(d=>d.obs)).size;
  document.getElementById("s-photos").textContent = 0;

  map.setView([-25.83, 28.24], 13);
}

// ── Toast ──
function toast(msg, show) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.style.display = show ? "block" : "none";
}

// ── Wire filters ──
["q","d-from","d-to"].forEach(id =>
  document.getElementById(id).addEventListener(id === "q" ? "input" : "change", () => render())
);

load();
</script>
